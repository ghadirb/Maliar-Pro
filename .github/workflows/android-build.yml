name: Android CI Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK commandline tools
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      # Generate keystore with fixed password for release signing
      - name: Generate Keystore for Release
        run: |
          keytool -genkey -v \
            -keystore android_release_key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias maliar_pro_key \
            -storepass "MaliarPro123!" \
            -keypass "MaliarPro123!" \
            -dname "CN=Maliar Pro, OU=Development, O=Maliar, L=Tehran, ST=Tehran, C=IR"
          echo "Keystore generated successfully"

      # Build Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
          KEYSTORE_STORE_PASSWORD: "MaliarPro123!"
          KEYSTORE_KEY_PASSWORD: "MaliarPro123!"
          KEYSTORE_KEY_ALIAS: "maliar_pro_key"
          KEYSTORE_STORE_FILE: "android_release_key.jks"
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Verify Release APK exists
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        run: test -f app/build/outputs/apk/release/app-release.apk

      # Upload Release APK
      - name: Upload Release APK artifact
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Verify Debug APK exists
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      # Upload Debug APK
      - name: Upload Debug APK artifact
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk