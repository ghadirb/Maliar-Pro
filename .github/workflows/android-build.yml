name: Android CI Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK commandline tools
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      # Restore static keystore from Base64 secret (if available)
      - name: Restore Keystore from Secret
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android_release_key.jks
            echo "Keystore restored from KEYSTORE_BASE64 secret"
          else
            echo "KEYSTORE_BASE64 secret not found. Will generate a new keystore."
            keytool -genkey -v \
              -keystore android_release_key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias maliar_pro_key \
              -storepass "${{ secrets.KEYSTORE_STORE_PASSWORD || 'MaliarPro123!' }}" \
              -keypass "${{ secrets.KEYSTORE_KEY_PASSWORD || 'MaliarPro123!' }}" \
              -dname "CN=Maliar Pro, OU=Development, O=Maliar, L=Tehran, ST=Tehran, C=IR"
            echo "NEW_KEYSTORE_GENERATED=true" >> $GITHUB_ENV
          fi

      # If a new keystore was generated, output its Base64 for saving as Secret
      - name: Output Keystore Base64 (for saving as Secret)
        if: env.NEW_KEYSTORE_GENERATED == 'true'
        run: |
          echo "============================================"
          echo "  NEW KEYSTORE GENERATED!"
          echo "  Copy the Base64 string below and save it"
          echo "  as a GitHub Secret named KEYSTORE_BASE64"
          echo "============================================"
          echo ""
          base64 -w0 android_release_key.jks
          echo ""
          echo "============================================"

      # Build Release APK
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
          KEYSTORE_STORE_PASSWORD: "${{ secrets.KEYSTORE_STORE_PASSWORD || 'MaliarPro123!' }}"
          KEYSTORE_KEY_PASSWORD: "${{ secrets.KEYSTORE_KEY_PASSWORD || 'MaliarPro123!' }}"
          KEYSTORE_KEY_ALIAS: "maliar_pro_key"
          KEYSTORE_STORE_FILE: "android_release_key.jks"
        run: gradle :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      # Upload Release APK
      - name: Upload Release APK artifact
        if: ${{ github.event.inputs.build_type == 'release' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Build Debug APK
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: gradle :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      # Upload Debug APK
      - name: Upload Debug APK artifact
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk